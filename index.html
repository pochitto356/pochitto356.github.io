<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>pochitto games</title>
<style>
  :root{
    --bg:#fff8ef; --card:#ffffff; --ink:#3b3028; --sub:#7d6f62;
    --line:#3b3028; --accent:#f5a623; --accent2:#ff8a3d;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#241d18; --card:#302620; --ink:#f6ece2; --sub:#bda994; --line:#0f0c0a; }
  }
  *{box-sizing:border-box}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.75; -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:720px;margin:0 auto;padding:56px 20px 72px}
  header{text-align:center;margin-bottom:48px}
  .logo{
    display:inline-block;font-size:30px;font-weight:900;letter-spacing:.5px;
    padding:14px 28px;border:3px solid var(--line);border-radius:20px;
    background:linear-gradient(180deg,var(--accent) 0%,var(--accent2) 100%);
    color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.25);
    box-shadow:0 5px 0 rgba(59,48,40,.55);
  }
  .tag{margin-top:18px;color:var(--sub);font-size:15px}
  h2{font-size:19px;margin:44px 0 16px;padding-left:12px;border-left:5px solid var(--accent)}
  .apps{display:grid;gap:16px}
  .app{
    display:block;text-decoration:none;color:inherit;
    background:var(--card);border:2px solid var(--line);border-radius:16px;
    padding:20px 22px;box-shadow:0 4px 0 rgba(59,48,40,.35);
    transition:transform .08s ease, box-shadow .08s ease;
  }
  .app:hover{transform:translateY(-2px);box-shadow:0 6px 0 rgba(59,48,40,.35)}
  .app .name{font-size:18px;font-weight:800;margin-bottom:4px}
  .app .desc{font-size:14px;color:var(--sub)}
  .app .store{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;color:#0a7cff}
  .soon{opacity:.6}
  .soon .store{color:var(--sub)}
  ul.links{list-style:none;padding:0;margin:0;display:grid;gap:8px}
  ul.links a{color:#0a7cff}
  footer{margin-top:56px;padding-top:24px;border-top:1px solid rgba(125,111,98,.3);
    text-align:center;color:var(--sub);font-size:13px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">pochitto games</div>
    <p class="tag">すきま時間に、ちょっと笑えるスマホゲームを作っています。</p>
  </header>

  <h2>アプリ</h2>
  <div class="apps">
    <a class="app" href="https://apps.apple.com/jp/app/id6793996412">
      <div class="name">押すな！ボタン</div>
      <div class="desc">押すなと言われると押したくなる。ただそれだけのボタンゲーム。</div>
      <span class="store">App Store で見る →</span>
    </a>
    <div class="app soon">
      <div class="name">マッスルフレンド</div>
      <div class="desc">タップで育てる筋肉育成ネタゲー。相棒マッチョをきたえよう。</div>
      <span class="store">近日公開</span>
    </div>
  </div>

  <h2>プライバシーポリシー</h2>
  <ul class="links">
    <li><a href="https://pochitto356.github.io/policies/privacy/">押すな！ボタン</a></li>
    <li><a href="https://pochitto356.github.io/policies/musclefriend/privacy/">マッスルフレンド</a></li>
  </ul>

  <h2>お問い合わせ</h2>
  <p>ご意見・不具合のご報告は <a href="mailto:pochittogames.jp@gmail.com">pochittogames.jp@gmail.com</a> までお願いします。</p>

  <footer>© 2026 pochitto games</footer>

</div>
</body>
</html>
